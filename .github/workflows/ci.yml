name: CI

on:
  push:
    branches: [main, 'copilot/**']
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build
        env:
          # Provide a dummy key so Next.js build does not fail on missing env.
          OPENAI_API_KEY: dummy-key-for-build
          JWT_SECRET: dummy-secret-for-build-at-least-32-chars-long
