name: Pull Request Reviewer

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ] # Triggers on new PRs or new commits pushed to the PR

jobs:
  review-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automates npm dependency caching

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever lockfiles change, or reuse the latest
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Verify Production Build (Turbopack)
        run: npm run build
        env:
          # Treats warnings as errors during the build stage to keep PRs clean
          CI: true
